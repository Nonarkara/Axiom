name: Restore Shanghai index.html
on:
  push:
    branches: [fix/shanghai-self-host-fonts]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shanghai-self-host-fonts
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore index from sidecar
        run: node scripts/fetch-fonts.mjs
      - name: Verify
        run: |
          lines=$(wc -l < public/index.html)
          echo "lines=$lines"
          test "$lines" -ge 2000
          ! grep -q 'fonts.googleapis.com/css' public/index.html
          grep -q 'fonts.css?v=20260921b' public/index.html
          grep -q 'flood.nonarkara.org' public/index.html
          grep -q 'sysStatus.degraded' public/index.html
      - name: Commit restored index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "index already restored"
            exit 0
          fi
          git commit -m "fix(type): restore full index.html from Shanghai sidecar"
          git push
