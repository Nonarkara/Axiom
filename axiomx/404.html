<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Axiom Reading Room</title>
  <meta name="description" content="This address does not exist in the Axiom reading room.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#faf9f7">
  <link rel="icon" href="https://axiom.nonarkara.org/assets/axiom-logo.png" type="image/png">
  <style>
    :root {
      --paper: #faf9f7;
      --ink: #191712;
      --ink-2: #4a463e;
      --ink-3: #6f6a60;
      --line: #e7e5dd;
      --line-2: #d6d3c8;
      --accent: #1c4286;
      --mono: ui-monospace, "JetBrains Mono", "IBM Plex Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'IBM Plex Sans Thai', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .notfound {
      max-width: 640px;
      margin: 0 auto;
      padding: 96px 24px 120px;
    }

    .notfound__flag {
      height: 4px;
      background: var(--ink);
      margin-bottom: 40px;
    }

    .notfound__code {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 0 0 18px;
    }

    .notfound__title {
      font-size: 34px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 20px;
    }

    .notfound__lede {
      font-size: 15px;
      line-height: 1.65;
      color: var(--ink-2);
      max-width: 52ch;
      margin: 0 0 36px;
    }

    .notfound__rule {
      height: 1px;
      background: var(--line-2);
      margin: 0 0 28px;
    }

    .notfound__links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .notfound__links a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--line-2);
      padding-bottom: 3px;
    }

    .notfound__links a:hover {
      border-bottom-color: var(--accent);
    }

    @media (max-width: 560px) {
      .notfound {
        padding: 64px 18px 96px;
      }

      .notfound__title {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="notfound">
    <div class="notfound__flag" aria-hidden="true"></div>
    <p class="notfound__code">Error 404 · No such entry</p>
    <h1 class="notfound__title">That entry is not in the book.</h1>
    <p class="notfound__lede">The reading room is one document with seventy-one entries, and this
      is not one of them. The index on the left holds every system, every cluster and every
      reading.</p>
    <div class="notfound__rule" aria-hidden="true"></div>
    <nav class="notfound__links" aria-label="Where to go instead">
      <a href="/">Back to the index</a>
      <a href="https://axiom.nonarkara.org/">The catalogue</a>
    </nav>
  </main>
</body>

</html>
