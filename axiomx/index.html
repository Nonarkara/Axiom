          <div class="research-commands"><div class="research-actions"><a class="research-preview" href="https://axiom.nonarkara.org/research/rain-to-phone-v1.pdf" data-research-preview="rain-to-phone" aria-labelledby="research-preview-rain-to-phone research-paper-rain-to-phone" aria-haspopup="dialog" target="_blank" rel="noopener"><img class="research-icon" src="vendor/lucide/book-open.svg" width="18" height="18" alt=""><span id="research-preview-rain-to-phone" data-i18n="research.preview">Preview</span></a><a href="https://axiom.nonarkara.org/research/rain-to-phone-v1.pdf" aria-labelledby="research-download-rain-to-phone research-paper-rain-to-phone" data-reader-label="pdf" title="Download PDF" download target="_blank" rel="noopener"><img class="research-icon" src="vendor/lucide/download.svg" width="18" height="18" alt=""><span class="research-sr" id="research-download-rain-to-phone" data-i18n="research.pdf">Download PDF</span></a><a href="https://flood.nonarkara.org/paper/flooddash-preprint-v1.pdf" data-reader-label="source" title="Source" target="_blank" rel="noopener"><img class="research-icon" src="vendor/lucide/external-link.svg" width="18" height="18" alt=""><span class="research-sr" data-i18n="research.source">Source</span></a></div>
          <details class="research-study"><summary data-reader-label="details" title="Study details"><img class="research-icon" src="vendor/lucide/info.svg" width="18" height="18" alt=""><span class="research-sr" data-i18n="research.details">Study details</span></summary><dl><dt data-i18n="research.question">Question</dt><dd lang="en">Can public flood feeds become a working rain-to-alert chain without waiting for agencies to merge?</dd><dt data-i18n="research.evidence">Evidence</dt><dd lang="en">124 days of alert records; 44 feeds. Median gauge-to-alert lag was 6.7 minutes in 162 matched alerts. A retrospective watchlist reached 84.4% recall at 12.5% precision (pp. 3-5).</dd><dt data-i18n="research.limitation">Limitations</dt><dd lang="en">The replay uses the same gauge network as its reference, not an independent flood record. Alert generation is not phone receipt or protective action; only 29 Telegram subscribers were recorded (pp. 3, 5).</dd></dl></details></div>
        </article>

          <details class="research-study"><summary data-reader-label="details" title="Study details"><img class="research-icon" src="vendor/lucide/info.svg" width="18" height="18" alt=""><span class="research-sr" data-i18n="research.details">Study details</span></summary><dl><dt data-i18n="research.question">Question</dt><dd lang="en">What can an open haze-warning chain deliver, and where do monitoring coverage and forecast skill still fall short?</dd><dt data-i18n="research.evidence">Evidence</dt><dd lang="en">110 pre-burning-season days; 58,298 scheduled pulls across 23 logged sources. 98.7% were marked successful despite two token-gated feeds skipping without data. Persistence outperformed the corrected forecast (pp. 3-4).</dd><dt data-i18n="research.limitation">Limitations</dt><dd lang="en">This is an early-season systems audit, not a multi-year trend or health-impact study. Telegram handoff to one or two chats does not establish population receipt or response (pp. 1, 3, 6).</dd></dl></details></div>

          <details class="research-study"><summary data-reader-label="details" title="Study details"><img class="research-icon" src="vendor/lucide/info.svg" width="18" height="18" alt=""><span class="research-sr" data-i18n="research.details">Study details</span></summary><dl><dt data-i18n="research.question">Question</dt><dd lang="en">Which links between measurement, warning and shelter can a provincial operations room assemble from public data?</dd><dt data-i18n="research.evidence">Evidence</dt><dd lang="en">An audit of 311 datasets, 2,869 resources and 177 official shelter rows. The official shelter list contained no coordinates; the system records differing precision for subsequently located shelters (pp. 2-5).</dd><dt data-i18n="research.limitation">Limitations</dt><dd lang="en">Catalogue absence means not found in the specified searches, not absent everywhere. This is a descriptive audit and feasibility study, not a test of institutional causes or warning outcomes (pp. 1-3).</dd></dl></details></div>

          <details class="research-study"><summary data-reader-label="details" title="Study details"><img class="research-icon" src="vendor/lucide/info.svg" width="18" height="18" alt=""><span class="research-sr" data-i18n="research.details">Study details</span></summary><dl><dt data-i18n="research.question">Question</dt><dd lang="en">What can ships, aircraft, thermal satellites, markets and regulators reveal from outside a conflict zone?</dd><dt data-i18n="research.evidence">Evidence</dt><dd lang="en">Five observation channels, with control ports and explicit coverage checks. Gulf port calls fell to 28% of their earlier rate; only 17.5% of 68,680 vessel positions were under six hours old (pp. 1-4).</dd><dt data-i18n="research.limitation">Limitations</dt><dd lang="en">One-event descriptive comparisons do not identify causes. Sparse receivers, stale positions and industrial heat cannot establish absent activity, weapons attribution or human impact (pp. 2, 5-6).</dd></dl></details></div>

        <article class="research-row" data-paper="smart-city-gaps" data-system="SCITI" data-region="thailand">
          <h2 id="research-paper-smart-city-gaps" lang="en">Four Gaps and One Chain: Where Thailand&#39;s Smart-City and Digital-Government Promotion Stops Short of Action</h2>
