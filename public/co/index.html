<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>co.nonarkara.org · Community places directory</title>
  <meta name="description" content="A directory of community places — cafés, co-working spaces, libraries — mapped across Bangkok and beyond. Built by Axiom X Co., Ltd.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="co.css?v=20261103a">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <link rel="icon" type="image/png" href="../../favicon-32.png">
</head>
<body>

  <!-- ============== MASTHEAD ============== -->
  <header class="masthead">
    <div class="flag-stripe" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="masthead__inner">
      <a href="/" class="brand">
        <span class="brand__name">co</span>
        <span class="brand__ver">nonarkara</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#places">Places</a>
        <a href="#map">Map</a>
        <a href="#about">About</a>
      </nav>
      <div class="co-search">
        <label class="sr-only">Search places</label>
        <input type="search" id="coSearch" placeholder="Search places &middot; ค้นหา" aria-label="Search places">
        <button class="co-search__btn" type="button" aria-label="Search"><span class="tri">▸</span></button>
      </div>
      <a href="https://axiom.nonarkara.org/" class="btn btn--primary" target="_blank" rel="noopener">Axiom</a>
    </div>
  </header>

  <!-- ============== STAGE — map + panel ============== -->
  <div class="co-stage" id="coStage">
    <div id="coMap"></div>
    <aside class="co-panel" id="coPanel" aria-label="Place details">
      <button class="co-panel__close" type="button" aria-label="Close place details">
        <span class="tri">▸</span>
      </button>
      <div class="co-panel__inner" id="coPanelInner">
        <!-- Place details injected here -->
      </div>
    </aside>
  </div>

  <!-- ============== FILTERS — category chips ============== -->
  <div class="co-filters" aria-label="Place categories">
    <button class="co-chip co-chip--active" data-cat="all">All</button>
    <button class="co-chip" data-cat="cafe">Café</button>
    <button class="co-chip" data-cat="cowork">Co-work</button>
    <button class="co-chip" data-cat="library">Library</button>
    <button class="co-chip" data-cat="food">Food</button>
  </div>

  <!-- ============== FOOTER ============== -->
  <footer class="foot">
    <div class="wrap">
      <div class="foot__row">
        <span class="brand__name">co.nonarkara.org</span>
        <nav class="nav" aria-label="Footer">
          <a href="https://axiom.nonarkara.org/" target="_blank" rel="noopener">Axiom</a>
          <a href="https://axiomx.nonarkara.org/" target="_blank" rel="noopener">Axiomx</a>
          <a href="https://blog.nonarkara.org/" target="_blank" rel="noopener">Blog</a>
        </nav>
      </div>
      <p class="foot__note" lang="en">A directory of community places mapped by Axiom X Co., Ltd. — Bangkok · Southeast Asia. © 2026 Axiom X Co., Ltd.</p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script defer src="co.js?v=20261103a"></script>

</body>
</html>
