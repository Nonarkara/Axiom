<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axiom — Full descriptions</title>
  <link rel="stylesheet" href="rams.css?v=20261110craft1">
</head>
<body>
  <header class="masthead">
    <div class="flag-stripe" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="masthead__inner">
      <a href="/" class="brand">
        <span class="brand__name">Axiom</span>
        <span class="brand__ver">Decision Systems</span>
      </a>
      <div id="localeSwitch" class="locale-switch" aria-label="Language">
        <button data-locale="en" class="active" aria-label="English">EN</button>
        <button data-locale="th" lang="th" aria-label="ภาษาไทย">TH</button>
        <button data-locale="zh" lang="zh-Hans" aria-label="中文（简体）">ZH</button>
        <button data-locale="ko" aria-label="한국어">KO</button>
        <button data-locale="ja" aria-label="日本語">JA</button>
        <button data-locale="vi" aria-label="Tiếng Việt">VI</button>
        <button data-locale="ts" class="locale-btn--ts" aria-label="TypeScript">&lt;/&gt;</button>
      </div>
      <a class="masthead-cta" href="/">Home</a>
    </div>
  </header>
  <main class="section" id="top">
    <div class="wrap">
      <p class="t-label">Catalogue record</p>
      <h1 class="t-big">Full descriptions</h1>
      <p class="t-body-2" style="max-width:66ch;margin:8px 0 18px;">The homepage keeps a short line. These are the sentences those lines were cut from.</p>
      <div id="record"></div>
    </div>
  </main>
  <script src="i18n-regional.js?v=20261110craft1"></script>
  <script src="app.js?v=20261110craft1"></script>
  <script src="record.js?v=20261110craft1"></script>
</body>
</html>
