name: Deploy axiomx to Cloudflare Pages

# axiomx/ is a second, separate site (the reading room) — it is NOT under
# public/ and is NOT deployed by cloudflare-pages.yml, which ships public/ only.
# Same secrets, same wrangler-action pin, no pre-checks. Deploys axiomx/ to the
# `axiomx` Pages project, whose canonical host is axiomx.nonarkara.org.

on:
  push:
    branches: [main]
    paths:
      - 'axiomx/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy axiomx --project-name=axiomx --branch=main