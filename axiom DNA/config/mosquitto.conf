# Axiom Framework - Mosquitto MQTT Broker Configuration
# Place this file at config/mosquitto.conf

# =============================================================================
# Network Listeners
# =============================================================================

# Standard MQTT port
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener (for browser-based dashboards)
listener 9001 0.0.0.0
protocol websockets

# =============================================================================
# Persistence
# =============================================================================

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# =============================================================================
# Logging
# =============================================================================

log_dest stdout
log_type error
log_type warning
log_type information
log_type notice
connection_messages true

# =============================================================================
# Security
# =============================================================================

# Disable anonymous access - all clients must authenticate
allow_anonymous false

# Password file (created by setup script or manually with mosquitto_passwd)
password_file /mosquitto/config/passwd

# Access control list
acl_file /mosquitto/config/acl

# =============================================================================
# Performance
# =============================================================================

# Maximum concurrent connections
max_connections 1000

# In-flight and queued message limits
max_inflight_messages 40
max_queued_messages 1000

# Message expiry (seconds)
message_expiry_interval 3600

# =============================================================================
# Bridging (optional - for multi-site deployments)
# =============================================================================
# Uncomment and configure for connecting to central broker
# connection bridge-to-central
# address central.axiom.go.th:1883
# topic municipal/# both 1
# remote_username bridge_user
# remote_password your_password
# bridge_protocol_version mqttv50
# try_private true
