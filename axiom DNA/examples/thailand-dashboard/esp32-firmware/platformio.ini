; Axiom Framework - ESP32 Sensor Firmware PlatformIO Configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partition scheme with more space for OTA updates
board_build.partitions = min_spiffs.csv

; Build flags for debugging and optimization
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

; Library dependencies
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; OTA upload (configure for your network)
; upload_protocol = espota
; upload_port = 192.168.1.100
; upload_flags = 
;     --auth=your_ota_password

; Monitor filters for cleaner serial output
monitor_filters = 
    esp32_exception_decoder
    time

; Debugging configuration (optional - requires JTAG)
; debug_tool = esp-prog
; debug_init_break = tbreak setup
